<form [formGroup]="smiteTwoGodForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <div class="form-group">
    <label for="name">God Name</label>
    <input type="text" id="name" formControlName="name" />
  </div>

  <div class="form-group">
    <label for="pantheon">Pantheon</label>
    <input type="text" id="pantheon" formControlName="pantheon" />
  </div>

  <div class="form-group">
    <label for="class">Class</label>
    <input type="text" id="class" formControlName="class" />
  </div>

  <div class="form-group">
    <label for="releaseDate">Release Date</label>
    <input type="text" id="releaseDate" formControlName="releaseDate" />
  </div>

  <div class="form-group">
    <label for="kitChanges">Kit Changed?</label>
    <input type="text" id="kitChanges" formControlName="kitChanges"/>
  </div>

  <div class="form-group">
    <label for="image">Image</label>
    <input type="text" id="image" formControlName="image">
  </div>

  <button type="submit">Submit</button>

  <button type="button" (click)="onDelete()">Delete</button>

  <button type="button" (click)="navigateToSmiteGodList()">Back to List</button>
</form>
