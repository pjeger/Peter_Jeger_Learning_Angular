<div class="smite-god-container" *ngFor="let smiteTwoGod of smiteTwoGodList">
  <h1>{{smiteTwoGod.name}}</h1>
  <p>{{smiteTwoGod.id}}</p>
  <p>{{smiteTwoGod.pantheon}}</p>
  <p>{{smiteTwoGod.class}}</p>
  <p>{{smiteTwoGod.releaseDate}}</p>
  <p>Has kit changes?: {{smiteTwoGod.kitChanges}}</p>
  <img src='{{smiteTwoGod.image}}' height="200px" width="200px" alt="{{smiteTwoGod.name}}">
  <br>
  <button type="button" (click)="edit()">Edit</button>
  <button type="button" (click)="delete(smiteTwoGod.id)">Delete</button>
</div>
